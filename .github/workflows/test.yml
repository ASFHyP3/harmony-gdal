name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  call-pytest-workflow:
    # Docs: https://github.com/ASFHyP3/actions
    uses: ASFHyP3/actions/.github/workflows/reusable-pytest.yml@v0.21.1
    permissions:
      contents: read
    with:
      local_package_name: harmony_gdal_adapter
      python_versions: >-
        ["3.14"]
