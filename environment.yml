name: harmony-gdal-adapter
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10
  - pip
  # For packaging, and testing
  - setuptools_scm
  - pytest
  - pytest-cov
  - xarray
  - h5netcdf
  - numpy
  # For running
  - gdal
  - libgdal-hdf5
  - pystac
  - argparse-dataclass
  - ruff
  - mypy
  - pip:
      - -e .[develop]

